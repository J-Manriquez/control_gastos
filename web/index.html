<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Control de Gastos App">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Control Gastos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Control Gastos</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase Core JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>

  <!-- Actualiza las versiones de Firebase y añade el orden correcto -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics-compat.js"></script>
  <script>
    // Deshabilitar la persistencia temporal hasta que la app esté lista
    window.FIREBASE_PERSIST_ENABLED = false;
  </script>
</head>

<body>
  <!-- Loading indicator -->
  <div id="loading">
    <style>
      body {
        background-color: #F5F5F5;
        margin: 0;
      }

      #loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3B5998;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove loading indicator once page is loaded
    window.addEventListener('load', function () {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.remove();
      }
    });

    // Enable Firestore offline persistence
    window.addEventListener('load', function () {
      if (firebase.firestore) {
        firebase.firestore().enablePersistence()
          .catch(function (err) {
            if (err.code == 'failed-precondition') {
              console.log('Multiple tabs open, persistence can only be enabled in one tab at a time.');
            } else if (err.code == 'unimplemented') {
              console.log('The current browser does not support persistence.');
            }
          });
      }
    });
  </script>

  <script src="main.dart.js" type="application/javascript"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
